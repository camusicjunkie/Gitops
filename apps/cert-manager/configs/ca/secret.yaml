# Populate with your local/internal CA certificate and private key (or seal with kubeseal).
apiVersion: v1
kind: Secret
metadata:
  name: internal-ca-keypair
  namespace: cert-manager
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
type: kubernetes.io/tls
stringData:
  tls.crt: |
    # Replace with your internal CA certificate PEM
  tls.key: |
    # Replace with your internal CA private key PEM
