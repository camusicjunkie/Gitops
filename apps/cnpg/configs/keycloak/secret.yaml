# PostgreSQL credentials for Keycloak.
# Encrypt in-place with:
#   sops --encrypt --in-place apps/cnpg/configs/keycloak/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-user
  namespace: sso
  labels:
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: keycloak
  password: REPLACE_WITH_DB_PASSWORD
