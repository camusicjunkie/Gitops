apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: headlamp
  valuesFrom:
    - kind: Secret
      name: headlamp-oidc
      valuesKey: client-secret
      targetPath: config.oidc.clientSecret
  values:
    config:
      inCluster: true
      oidc:
        clientID: headlamp
        issuerURL: https://keycloak.${APPS_SUBDOMAIN}.${NETWORK_DOMAIN}/realms/midworld
        scopes: "openid,profile,email,groups"
        callbackURL: https://headlamp.${APPS_SUBDOMAIN}.${NETWORK_DOMAIN}/oidc-callback
    clusterRoleBinding:
      create: false
    serviceAccount:
      create: true
    ingress:
      enabled: false
