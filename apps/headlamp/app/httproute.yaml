apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  namespace: headlamp
spec:
  parentRefs:
    - name: main-gateway
      namespace: istio-system
      sectionName: https
  hostnames:
    - headlamp.${APPS_SUBDOMAIN}.${NETWORK_DOMAIN}
  rules:
    - backendRefs:
        - name: headlamp
          port: 80
