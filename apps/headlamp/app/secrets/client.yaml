# Secret for the Keycloak `headlamp` confidential client.
# Populate stringData.client-secret and encrypt in-place with:
#   sops --encrypt --in-place apps/headlamp/app/secrets/client.yaml
# Keep in sync with apps/headlamp/app/secrets/oidc.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-client-secret
  namespace: sso
type: Opaque
stringData:
  client-secret: REPLACE_WITH_HEX_SECRET
