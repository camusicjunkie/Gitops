# OIDC client secret for Headlamp (Keycloak `headlamp` client).
# Populate stringData.client-secret and encrypt in-place with:
#   sops --encrypt --in-place apps/headlamp/app/secrets/oidc.yaml
# Keep in sync with apps/headlamp/app/secrets/client.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-oidc
  namespace: headlamp
type: Opaque
stringData:
  client-secret: REPLACE_WITH_HEX_SECRET
