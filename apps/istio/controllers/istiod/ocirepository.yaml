apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: istiod
  namespace: istio-system
spec:
  interval: 1h
  url: oci://${HARBOR_REGISTRY}/${HARBOR_PROJECT}/istio/charts/istiod
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "1.30.1" # {"$imagepolicy": "flux-system:istiod-chart:tag"}
