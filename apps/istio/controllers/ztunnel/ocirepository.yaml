  name: ztunnel
  namespace: istio-system
spec:
  interval: 1h
  url: oci://${HARBOR_REGISTRY}/${HARBOR_PROJECT}/istio/charts/ztunnel
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "1.32.0" # {"$imagepolicy": "flux-system:ztunnel-chart:tag"}
