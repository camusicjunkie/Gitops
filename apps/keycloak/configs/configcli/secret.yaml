# Admin credentials used by keycloak-config-cli to reconcile the midworld realm.
# Encrypt in-place with:
#   sops --encrypt --in-place apps/keycloak/configs/configcli/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-config-cli-admin
  namespace: sso
type: Opaque
stringData:
  username: admin
  password: REPLACE_WITH_ADMIN_PASSWORD
