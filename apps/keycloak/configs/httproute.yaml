apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: sso
spec:
  parentRefs:
    - name: main-gateway
      namespace: istio-system
      sectionName: https
  hostnames:
    - keycloak.${APPS_SUBDOMAIN}.${NETWORK_DOMAIN}
  rules:
    - backendRefs:
        - name: keycloak-service
          port: 8080
