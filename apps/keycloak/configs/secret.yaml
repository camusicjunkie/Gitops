# Bootstrap admin credentials for Keycloak.
# Encrypt in-place with:
#   sops --encrypt --in-place apps/keycloak/configs/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-bootstrap-admin
  namespace: sso
type: Opaque
stringData:
  username: admin
  password: REPLACE_WITH_ADMIN_PASSWORD
