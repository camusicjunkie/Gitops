apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Operator (SA/RBAC/Deployment from cluster-wide/kubernetes.yml) runs in the
# keycloak namespace while watching all namespaces (JOSDK_ALL_NAMESPACES).
namespace: keycloak

resources:
  # vendored upstream (keycloak-k8s-resources @ 26.8.2) — see update.sh
  - crds/keycloaks.k8s.keycloak.org.yml
  - crds/keycloakrealmimports.k8s.keycloak.org.yml
  - crds/keycloakoidcclients.k8s.keycloak.org.yml
  - crds/keycloaksamlclients.k8s.keycloak.org.yml
  - operator.yml
  # local addition
  - namespace.yaml

transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: keycloak-namespace
    setRoleBindingSubjects: allServiceAccounts
    fieldSpecs:
      - path: metadata/namespace
        create: true
