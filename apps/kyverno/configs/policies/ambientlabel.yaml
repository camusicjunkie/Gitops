# Ensures application namespaces are enrolled in Istio ambient mode.
# Start with KYVERNO_VALIDATION_ACTION=Audit in settings.yaml, then switch to Deny.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-ambient-dataplane
spec:
  validationActions:
    - ${KYVERNO_VALIDATION_ACTION}
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  matchConditions:
    - name: exclude-system-namespaces
      expression: >-
        !(object.metadata.name in [
          'flux-system', 'istio-system', 'cert-manager', 'kyverno',
          'cnpg-system', 'kube-system', 'kube-public', 'kube-node-lease'
        ])
  validations:
    - message: "Application namespaces must set label istio.io/dataplane-mode: ambient."
      expression: "object.metadata.?labels['istio.io/dataplane-mode'].orValue('') == 'ambient'"
