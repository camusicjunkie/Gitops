apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sync-harbor-pull-secret
spec:
  rules:
    - name: sync-harbor-pull-secret
      match:
        any:
          - resources:
              kinds:
                - Namespace
      exclude:
        any:
          - resources:
              namespaces:
                - flux-system
                - kyverno
                - kube-system
                - kube-public
                - kube-node-lease
      generate:
        apiVersion: v1
        kind: Secret
        name: harbor-pull
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        generateExisting: true
        clone:
          namespace: flux-system
          name: harbor-pull
