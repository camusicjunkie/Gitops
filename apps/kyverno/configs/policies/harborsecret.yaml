apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: sync-harbor-pull-secret
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  matchConditions:
    - name: exclude-system-namespaces
      expression: >-
        !(object.metadata.name in [
          'flux-system', 'kyverno', 'kube-system', 'kube-public', 'kube-node-lease'
        ])
  variables:
    - name: targetNs
      expression: "object.metadata.name"
    - name: sourceSecret
      expression: 'resource.Get("v1", "secrets", "flux-system", "harbor-pull")'
  generate:
    - expression: >-
        generator.Apply(variables.targetNs, [{
          "apiVersion": "v1",
          "kind": "Secret",
          "metadata": {"name": "harbor-pull"},
          "type": variables.sourceSecret.type,
          "data": variables.sourceSecret.data
        }])
