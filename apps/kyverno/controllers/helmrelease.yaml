apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kyverno
  values:
    global:
      image:
        registry: ghcr.io
    admissionController:
      replicas: 1
    backgroundController:
      replicas: 1
    reportsController:
      enabled: false
    cleanupController:
      enabled: false
