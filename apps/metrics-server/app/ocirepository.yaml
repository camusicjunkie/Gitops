apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  interval: 1h
  url: oci://${HARBOR_REGISTRY}/${HARBOR_PROJECT}/metrics-server/charts/metrics-server
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "0.0.0" # {"$imagepolicy": "flux-system:metrics-server-chart:tag"}
