apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stigman
  namespace: stigman
spec:
  parentRefs:
    - name: main-gateway
      namespace: istio-system
      sectionName: https
  hostnames:
    - stigman.${APPS_SUBDOMAIN}.${NETWORK_DOMAIN}
  rules:
    - backendRefs:
        - name: stigman
          port: 54000
