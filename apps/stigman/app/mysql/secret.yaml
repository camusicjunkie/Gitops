# MySQL credentials for STIG Manager.
# Encrypt in-place with:
#   sops --encrypt --in-place apps/stigman/app/mysql/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: stigman
type: Opaque
stringData:
  root-db-password: REPLACE_WITH_ROOT_PASSWORD
  stigman-db-password: REPLACE_WITH_STIGMAN_PASSWORD
