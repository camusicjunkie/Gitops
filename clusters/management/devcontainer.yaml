# Devcontainer Pods (camusicjunkie/k8scontainer) on the management cluster:
# - Waits for istiod to be Ready (which in turn waits for Gateway API CRDs).
# - Owns Namespace/devcontainer (restricted PSA, prune disabled for both the
#   ResourceSet and kustomize-controller) so admin PVCs are never pruned,
#   copies harbor-ca and harbor-pull from flux-system, and sets harbor-pull on the default ServiceAccount (no API token mounted).
# - Defines read-only (devcontainer) and push (devcontainer-push) GitRepositories
#   for ${DEVCONTAINER_REPO_URL}, matching image-automation-push's token split.
# - Syncs ./manifests/devcontainer without wait: true, substituting this
#   network's runtime facts from flux-runtime-info (postBuild): the repository
#   commits nothing network-specific and reads HARBOR_REGISTRY, HARBOR_PROJECT
#   and the DEVCONTAINER_* facts bootstrap writes (Site Config, Gateway
#   address, Pod CIDR) as Flux variables. Its tests/site/facts.env is the
#   contract; a missing fact fails the sync (StrictPostBuildSubstitutions).
# - Runs ImageUpdateAutomation in devcontainer (only sees same-namespace
#   ImagePolicies), committing only the Roster's imageTag to image-updates via
#   devcontainer-push.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: devcontainer
  namespace: flux-system
spec:
  dependsOn:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: istiod
      namespace: istio-system
      ready: true
  inputs:
    - namespace: devcontainer
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: << inputs.namespace >>
        labels:
          pod-security.kubernetes.io/enforce: restricted
          pod-security.kubernetes.io/enforce-version: latest
        annotations:
          fluxcd.controlplane.io/prune: disabled
          # Also kustomize-controller's: if manifests/devcontainer ever ships
          # this Namespace again, its Kustomization must not prune it.
          kustomize.toolkit.fluxcd.io/prune: disabled
    - apiVersion: v1
      kind: Secret
      metadata:
        name: harbor-ca
        namespace: << inputs.namespace >>
        annotations:
          fluxcd.controlplane.io/copyFrom: flux-system/harbor-ca
      type: Opaque
    - apiVersion: v1
      kind: Secret
      metadata:
        name: harbor-pull
        namespace: << inputs.namespace >>
        annotations:
          fluxcd.controlplane.io/copyFrom: flux-system/harbor-pull
      type: kubernetes.io/dockerconfigjson
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: default
        namespace: << inputs.namespace >>
        annotations:
          fluxcd.controlplane.io/prune: disabled
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-pull
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      metadata:
        name: devcontainer
        namespace: flux-system
      spec:
        interval: 5m
        url: ${DEVCONTAINER_REPO_URL}
        ref:
          branch: main
        secretRef:
          name: devcontainer-git
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      metadata:
        name: devcontainer-push
        namespace: flux-system
      spec:
        interval: 10m
        url: ${DEVCONTAINER_REPO_URL}
        ref:
          branch: main
        secretRef:
          name: devcontainer-git-push
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: devcontainer
        namespace: flux-system
      spec:
        interval: 10m
        retryInterval: 2m
        timeout: 10m
        prune: true
        sourceRef:
          kind: GitRepository
          name: devcontainer
        path: ./manifests/devcontainer
        postBuild:
          substituteFrom:
            - kind: ConfigMap
              name: flux-runtime-info
    - apiVersion: image.toolkit.fluxcd.io/v1
      kind: ImageUpdateAutomation
      metadata:
        name: devcontainer
        namespace: << inputs.namespace >>
      spec:
        interval: 10m
        sourceRef:
          kind: GitRepository
          name: devcontainer-push
          namespace: flux-system
        git:
          checkout:
            ref:
              branch: main
          commit:
            author:
              name: fluxcdbot
              email: fluxcdbot@users.noreply.github.com
            messageTemplate: "chore(images): update the Standard Image tag [skip ci]"
          push:
            branch: image-updates
        update:
          path: ./manifests/devcontainer
          strategy: Setters
