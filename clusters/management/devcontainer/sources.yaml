# The devcontainer repository (camusicjunkie/k8scontainer, mirrored to this
# network's GitLab): one read-only GitRepository that Flux syncs from, and one
# with its own write_repository token that only the image automation pushes
# with, as flux-system / image-automation-push do for this repository.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: devcontainer
  namespace: flux-system
spec:
  interval: 5m
  url: ${DEVCONTAINER_REPO_URL}
  ref:
    branch: main
  secretRef:
    name: devcontainer-git
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: devcontainer-push
  namespace: flux-system
spec:
  interval: 10m
  url: ${DEVCONTAINER_REPO_URL}
  ref:
    branch: main
  secretRef:
    name: devcontainer-git-push
