apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: kyverno-chart
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: kyverno-chart
  policy:
    semver:
      # Chart 3.10 (Kyverno 1.20) refuses kyverno.io/v1 ClusterPolicy, which
      # every policy in apps/kyverno/configs is. Widen after migrating them.
      range: "3.9.x"
