apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: kyverno-chart
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: kyverno-chart
  policy:
    semver:
      # Temporary guardrail matching bootstrap/mirror/platform.yaml (>=3.9.0 <3.10.0):
      # chart 3.10 (Kyverno 1.20) drops kyverno.io/v1 ClusterPolicy execution.
      # Reset to "*" after migrating apps/kyverno/configs/policies to policies.kyverno.io/v1.
      range: "3.9.x"
