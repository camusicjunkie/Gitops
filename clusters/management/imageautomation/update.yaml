# The automation pushes with its own write credentials; the flux-system
# GitRepository that syncs the cluster keeps a read-only token.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system-push
  namespace: flux-system
spec:
  interval: 10m
  url: ${GIT_REPO_URL}
  ref:
    branch: main
  secretRef:
    name: flux-system-push
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system-push
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: |
        chore(images): update automated image tags

        {{ range $filename, $changes := .Changed.FileChanges -}}
        - {{ $filename }}
        {{ end -}}
    push:
      branch: image-updates
  update:
    path: ./apps
    strategy: Setters
