# Istio on the management cluster: the Gateway API CRDs (standard channel; Istio
# reads TCPRoute v1 from 1.31), istio-base and istiod only, so
# `gatewayClassName: istio` Gateways (the devcontainer's SSH Gateway) get a
# gateway deployment. No mesh: istio-cni and ztunnel are left out and istiod
# runs without the ambient profile; workloads here are reached through their
# Gateway, not enrolled.
#
# This cluster runs no Kyverno to rewrite images to Harbor, so istiod and the
# gateways it deploys pull from the Harbor mirror directly (global.hub), with
# harbor-pull; the ResourceSet below copies that Secret into istio-system.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istio
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/istio/controllers
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: flux-runtime-info
  patches:
    - patch: |
        $patch: delete
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: istio-cni
          namespace: istio-system
    - patch: |
        $patch: delete
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: istio-cni
          namespace: istio-system
    - patch: |
        $patch: delete
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: ztunnel
          namespace: istio-system
    - patch: |
        $patch: delete
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: ztunnel
          namespace: istio-system
    - target:
        kind: HelmRelease
        name: istiod
      patch: |
        - op: remove
          path: /spec/values/profile
        - op: add
          path: /spec/values/global
          value:
            hub: ${HARBOR_REGISTRY}/${HARBOR_PROJECT}/istio
            imagePullSecrets:
              - harbor-pull
    - target:
        kind: HelmRelease
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: _
        spec:
          install:
            crds: Create
          upgrade:
            crds: CreateReplace
          driftDetection:
            mode: enabled
---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: istio-pull
  namespace: flux-system
spec:
  dependsOn:
    - apiVersion: v1
      kind: Namespace
      name: istio-system
  inputs:
    - namespace: istio-system
  resources:
    - apiVersion: v1
      kind: Secret
      metadata:
        name: harbor-pull
        namespace: << inputs.namespace >>
        annotations:
          fluxcd.controlplane.io/copyFrom: flux-system/harbor-pull
      type: kubernetes.io/dockerconfigjson
