# Istio on the management cluster (self-contained, gateway-only):
# Gateway API standard v1.7.0 CRDs live in clusters/management/gatewayapi/, and
# this ResourceSet installs istio-base and istiod directly without cni, ztunnel,
# the ambient profile, or privileged PSA on istio-system so `gatewayClassName:
# istio` Gateways get a gateway Deployment and nothing joins a mesh.
#
# This cluster runs no Kyverno to rewrite images or sync secrets, so this
# ResourceSet owns Namespace/istio-system, copies harbor-pull and harbor-ca from
# flux-system, and configures OCIRepository sources and istiod global.hub
# directly with zero patches.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: istio
  namespace: flux-system
spec:
  dependsOn:
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: gateways.gateway.networking.k8s.io
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: tcproutes.gateway.networking.k8s.io
  inputs:
    - namespace: istio-system
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: << inputs.namespace >>
        annotations:
          fluxcd.controlplane.io/prune: disabled
    - apiVersion: v1
      kind: Secret
      metadata:
        name: harbor-pull
        namespace: << inputs.namespace >>
        annotations:
          fluxcd.controlplane.io/copyFrom: flux-system/harbor-pull
      type: kubernetes.io/dockerconfigjson
    - apiVersion: v1
      kind: Secret
      metadata:
        name: harbor-ca
        namespace: << inputs.namespace >>
        annotations:
          fluxcd.controlplane.io/copyFrom: flux-system/harbor-ca
      type: Opaque
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: istio-base
        namespace: << inputs.namespace >>
      spec:
        interval: 1h
        url: oci://${HARBOR_REGISTRY}/${HARBOR_PROJECT}/istio/charts/base
        certSecretRef:
          name: harbor-ca
        secretRef:
          name: harbor-pull
        layerSelector:
          mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
          operation: copy
        ref:
          tag: "1.32.0"
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: istio-base
        namespace: << inputs.namespace >>
      spec:
        interval: 30m
        chartRef:
          kind: OCIRepository
          name: istio-base
        install:
          crds: Create
        upgrade:
          crds: CreateReplace
        driftDetection:
          mode: enabled
        values:
          defaultRevision: default
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: istiod
        namespace: << inputs.namespace >>
      spec:
        interval: 1h
        url: oci://${HARBOR_REGISTRY}/${HARBOR_PROJECT}/istio/charts/istiod
        certSecretRef:
          name: harbor-ca
        secretRef:
          name: harbor-pull
        layerSelector:
          mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
          operation: copy
        ref:
          tag: "1.32.0"
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: istiod
        namespace: << inputs.namespace >>
      spec:
        interval: 30m
        dependsOn:
          - name: istio-base
        chartRef:
          kind: OCIRepository
          name: istiod
        install:
          crds: Create
        upgrade:
          crds: CreateReplace
        driftDetection:
          mode: enabled
        values:
          defaultRevision: default
          global:
            hub: "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/istio"
            imagePullSecrets:
              - harbor-pull
