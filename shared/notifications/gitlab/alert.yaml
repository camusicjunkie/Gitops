apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: flux
  namespace: flux-system
spec:
  providerRef:
    name: gitlab
  eventSeverity: info
  eventMetadata:
    summary: "${CLUSTER_NAME} (${CLUSTER_ENV}/${CLUSTER_COLOR})"
    cluster: "${CLUSTER_NAME}"
    env: "${CLUSTER_ENV}"
    color: "${CLUSTER_COLOR}"
  eventSources:
    - kind: GitRepository
      name: "*"
    - kind: OCIRepository
      name: "*"
    - kind: Kustomization
      name: "*"
    - kind: HelmRelease
      name: "*"
    - kind: ImageRepository
      name: "*"
    - kind: ImagePolicy
      name: "*"
    - kind: ImageUpdateAutomation
      name: "*"
