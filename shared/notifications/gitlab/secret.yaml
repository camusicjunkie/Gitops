# GitLab API token (api scope) for posting Flux commit status / alerts.
# Encrypt in-place with:
#   sops --encrypt --in-place shared/notifications/gitlab/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-notification
  namespace: flux-system
type: Opaque
stringData:
  token: REPLACE_WITH_GITLAB_API_TOKEN
