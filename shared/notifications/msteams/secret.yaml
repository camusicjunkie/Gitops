# Microsoft Teams incoming webhook URL for Flux error alerts.
# Encrypt in-place with:
#   sops --encrypt --in-place shared/notifications/msteams/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: msteams-webhook
  namespace: flux-system
type: Opaque
stringData:
  address: https://REPLACE_WITH_MSTEAMS_WEBHOOK_URL
