# Shared webhook secret token configured in your GitLab Project Webhook (Settings -> Webhooks).
# Encrypt in-place with:
#   sops --encrypt --in-place shared/receiver/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-webhook-token
  namespace: flux-system
type: Opaque
stringData:
  token: REPLACE_WITH_RANDOM_WEBHOOK_TOKEN
