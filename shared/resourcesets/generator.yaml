apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: apps
  namespace: flux-system
  annotations:
    source.extensions.fluxcd.io/reconcileEvery: "10m"
spec:
  sources:
    - alias: repo
      kind: GitRepository
      name: flux-system
  commonMetadata:
    labels:
      source.extensions.fluxcd.io/generator: apps
  pathPattern: "@repo/apps/{app}/app"
  artifacts:
    - name: "app-{app}"
      originRevision: "@repo"
      copy:
        - from: "@repo/apps/{app}/app/**"
          to: "@artifact/"
