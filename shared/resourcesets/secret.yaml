# OIDC client secret for Flux Web UI (Keycloak `flux-web` client).
# Populate stringData.client-secret and encrypt in-place with:
#   sops --encrypt --in-place shared/resourcesets/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: flux-web-client
  namespace: flux-system
  labels:
    reconcile.fluxcd.io/watch: Enabled
type: Opaque
stringData:
  client-id: flux-web
  client-secret: REPLACE_WITH_FLUX_WEB_CLIENT_SECRET
